[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musings"
version = "0.2.0"
description = "A mortal FastAPI service for bidirectional communication with a sandboxed party: file drop box, async job queue, synchronous shell rendezvous, and EOT-terminated runs."
authors = [
    {name = "Rudolph Pienaar", email = "rudolph.pienaar@childrens.harvard.edu"}
]
license = {text = "MIT"}
readme = {file = "README.adoc", content-type = "text/x-asciidoc"}
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "hostlib",
]

[project.urls]
homepage = "https://github.com/rudolphpienaar/musings"
repository = "https://github.com/rudolphpienaar/musings"

[project.scripts]
musings = "client.cli:cli_run"
musings-server = "app.main:server_run"
musings-poller = "client.poller:poller_run"
musings-repl = "client.repl:repl_run"
musings-rcli-executor = "client.rcli_executor:executor_run"
mush = "client.mush:mush_run"

[tool.setuptools.packages.find]
include = ["app*", "client*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
